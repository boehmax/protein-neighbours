[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "protein-neighbours"
version = "0.2.0"
description = "A Python package for analyzing the genomic environment of proteins"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Maximilian Böhm", email = "maximilian.bohm@kemi.uu.se"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "pandas>=1.3.0",
    "numpy>=1.20.0",
    "matplotlib>=3.3.0",
    "seaborn>=0.11.0",
    "biopython>=1.79",
    "pyyaml>=5.4.0",
    "scipy>=1.7.0",
    "jinja2>=3.0.0",
    "click>=8.0.0",
    "tqdm>=4.60.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "pytest-cov>=2.12",
    "black>=21.0",
    "flake8>=3.9",
    "mypy>=0.900",
]
eggnog = [
    "eggnog-mapper>=2.1.0",
]

[project.scripts]
protein-neighbours = "protein_neighbours.main:main"

[project.urls]
Homepage = "https://github.com/boehmax/protein-neighbours"
Repository = "https://github.com/boehmax/protein-neighbours"
Issues = "https://github.com/boehmax/protein-neighbours/issues"

[tool.setuptools.packages.find]
include = ["protein_neighbours*"]

[tool.setuptools.package-data]
protein_neighbours = ["config/*.yaml", "templates/*.html"]

[tool.black]
line-length = 88
target-version = ['py38']

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --strict-markers"
testpaths = [
    "tests",
    "test_protein_neighbours.py",
]